<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半导体 IDM 网络交互全览图 · 一次连接的旅程</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 2 2 7v10l10 5 10-5V7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#edf1f6; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#d5dde8;
  --it:#2563eb; --itbg:#e8f0fe; --dmz:#0e8fa8; --dmzbg:#e2f4f7; --idmz:#7c3aed; --idmzbg:#f1eafe;
  --ot:#d97706; --otbg:#fdf0dd; --sec:#dc2626; --secbg:#fdeaea; --mgmt:#475569; --mgmtbg:#eef1f5;
  --ext:#334155; --ok:#16a34a; --deny:#dc2626;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding:0 22px 60px}

/* ===== 顶部 ===== */
header.top{background:linear-gradient(135deg,#0b1f3a 0%,#123a66 55%,#1d4e89 100%);color:#fff;padding:30px 0 26px;margin-bottom:24px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.top .wrap{padding-bottom:0;margin-bottom:0}
.eyebrow{font-size:12px;letter-spacing:.22em;color:#9cc2f0;font-weight:500;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:.01em}
.lead{color:#c6d8ee;margin-top:8px;max-width:920px;font-size:14px}
.lead b{color:#fff}

/* ===== 接入方式切换 ===== */
.access{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 14px}
.access-card{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:.18s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.access-card:hover{transform:translateY(-1px);border-color:#94a3b8}
.access-card .ac-ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.access-card .ac-ic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.8}
.access-card .ac-t{font-size:14.5px;font-weight:700}
.access-card .ac-d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.access-card.active{border-color:var(--it);box-shadow:var(--shadow)}
.access-card[data-id="wan"].active{border-color:var(--it)}
.access-card[data-id="lan"].active{border-color:var(--ot)}
.access-card .ac-ic.wan{background:var(--it)}
.access-card .ac-ic.lan{background:var(--ot)}

/* ===== 目标场景选择 ===== */
.scenarios{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.scenario{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:9px;transition:.18s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.scenario .dot{width:9px;height:9px;border-radius:50%;flex:none}
.scenario:hover{border-color:#94a3b8;transform:translateY(-1px)}
.scenario.active{border-color:var(--it);background:var(--itbg);color:#1d4ed8;box-shadow:var(--shadow)}
.scenario[data-tone="deny"].active{border-color:var(--deny);background:var(--secbg);color:#b91c1c}

/* ===== 主布局 ===== */
.board{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.map-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.map-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.map-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.tag{font-family:var(--mono);font-size:11px;background:var(--mgmtbg);color:var(--mgmt);padding:3px 8px;border-radius:6px;font-weight:500}
.svgbox{padding:10px;line-height:0}
svg#topo{width:100%;height:auto;display:block;font-family:var(--sans)}

/* ===== 控制条 ===== */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--it);color:var(--it)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--it);border-color:var(--it);color:#fff}
.btn.primary:hover{background:#1d4ed8;color:#fff}
.btn svg{width:15px;height:15px;fill:currentColor}
.progress{flex:1 1 140px;min-width:120px;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--it),#60a5fa);border-radius:99px;width:0;transition:width .35s ease}
.stepno{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* ===== 右侧面板 ===== */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.panel-b{padding:16px}
.journey-step{font-family:var(--mono);font-size:11px;color:var(--it);font-weight:700;letter-spacing:.05em}
.journey-title{font-size:16px;font-weight:700;margin:4px 0 6px}
.journey-desc{font-size:13px;color:#334155;margin-bottom:12px}
.five{background:#0f1f3a;border-radius:10px;padding:12px 13px;font-family:var(--mono);font-size:11.5px;color:#cfe0f5;line-height:1.7;overflow-x:auto}
.five .k{color:#7fa8d6}
.five .arrow{color:#fbbf24}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin:0 6px 6px 0}
.chip.allow{background:#e7f6ec;color:#15803d}
.chip.deny{background:var(--secbg);color:#b91c1c}
.chip.oneway{background:#fef3e2;color:#b45309}
.chip.enc{background:#eef2ff;color:#4338ca}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 10px;font-size:12.5px;margin-top:6px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-all}
.kv dd.mono{font-family:var(--mono);font-size:11.5px}
.hintbox{font-size:12px;color:var(--muted);background:var(--mgmtbg);border-radius:9px;padding:10px 12px;line-height:1.6}
.hintbox b{color:var(--ink)}

/* ===== 图例 ===== */
.legend{display:flex;flex-wrap:wrap;gap:14px 20px;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:#334155}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;flex:none}
.legend .ln{width:26px;height:0;border-top:3px solid var(--mgmt)}
.legend .ln.dash{border-top:2.5px dashed var(--deny)}

/* ===== SVG 动态元素样式 ===== */
.zone-rect{stroke-width:1.5;rx:11}
.node{cursor:pointer}
.node .card{stroke-width:1.6;rx:10;transition:.2s}
.node .nlabel{font-size:13.5px;font-weight:700;fill:#0f172a}
.node .nsub{font-size:10.5px;fill:#64748b;font-family:var(--mono)}
.node .nicon{fill:none;stroke-width:1.7}
.dim{opacity:.18;transition:opacity .4s}
.edge{fill:none;transition:stroke-width .15s,opacity .3s}
.edge-hit{stroke:transparent;stroke-width:18;stroke-linecap:round;cursor:pointer}
.edge-visible{stroke-width:2.4;stroke-linecap:round;cursor:pointer}
.edge-visible:hover{stroke-width:4}
.edge-visible.flow{stroke-dasharray:9 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.edge-visible.dim{opacity:.12}
.edge-visible.selected{stroke-width:4.5;filter:drop-shadow(0 0 5px rgba(37,99,235,.45))}
.packet{fill:#fbbf24;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(251,191,36,.8))}
.zone-title{font-size:12px;font-weight:700;letter-spacing:.04em}
.badge-x{fill:#dc2626}
.badge-check{fill:#16a34a}

/* ===== tooltip ===== */
#tip{position:fixed;z-index:99;pointer-events:none;background:#0f1f3a;color:#e6f0fb;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:270px;opacity:0;transition:opacity .12s;line-height:1.6}
#tip.show{opacity:1}
#tip .tt{font-weight:700;font-size:13px;color:#fff;margin-bottom:3px}
#tip .tm{font-family:var(--mono);font-size:10.5px;color:#9cc2f0}
#tip .ta{margin-top:5px;font-weight:600}
#tip .ta.a{color:#4ade80}#tip .ta.d{color:#f87171}

/* ===== 响应式 ===== */
@media(max-width:1080px){.board{grid-template-columns:1fr}.side{position:static;order:2}}
@media(max-width:560px){
  .wrap{padding:0 13px 40px}
  .access{grid-template-columns:1fr}
  .scenario{flex:1 1 100%}
  .btn{padding:8px 11px}
  .kv{grid-template-columns:78px 1fr}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">PACKET JOURNEY · INTERACTIVE NETWORK MAP</div>
  <h1>半导体 IDM 网络交互全览图 · 一次连接的旅程</h1>
  <p class="lead">以 <b>内网 VDI（本地瘦终端）与外网 VDI（远程 SSL VPN）</b>两种接入为例，看一个会话如何逐跳穿过接入层、边界防火墙、DMZ 与核心交换，最终进入各网段。点击任意流向查看连接信息，悬停快速预览，用播放键把复杂网络<b>一步步肢解</b>。</p>
</div></header>

<div class="wrap">
  <!-- 接入方式切换（内网 VDI / 外网 VDI） -->
  <div class="access" id="access"></div>
  <!-- 目标场景按钮由 JS 生成 -->
  <div class="scenarios" id="scenarios"></div>

  <div class="board">
    <!-- 拓扑图 -->
    <div class="map-card">
      <div class="map-head">
        <h2>华芯半导体 · Fab1 全览拓扑 <span class="tag">逻辑视图 · 示例数据</span></h2>
        <div class="controls">
          <button class="btn" id="prev" type="button"><svg viewBox="0 0 24 24"><path d="M15 6 9 12l6 6z"/></svg>上一步</button>
          <button class="btn primary" id="play" type="button"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg><span id="playTxt">播放</span></button>
          <button class="btn" id="next" type="button">下一步<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></button>
          <button class="btn" id="reset" type="button"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 7l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>重置</button>
          <div class="progress"><i id="bar"></i></div>
          <span class="stepno" id="stepno">0 / 0</span>
        </div>
      </div>
      <div class="svgbox"><svg id="topo" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div>
      <div class="legend" id="legend"></div>
    </div>

    <!-- 右侧：旅程 / 详情 -->
    <div class="side">
      <div class="panel">
        <div class="panel-h">当前步骤</div>
        <div class="panel-b" id="journey"></div>
      </div>
      <div class="panel">
        <div class="panel-h">连接 / 设备详情</div>
        <div class="panel-b" id="detail"></div>
      </div>
    </div>
  </div>
</div>

<div id="tip"></div>

var EDGES = [

var SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){
  var e=document.createElementNS(SVGNS,tag);
  for(var k in attrs){ e.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function getNode(id){ for(var i=0;i<NODES.length;i++){if(NODES[i].id===id)return NODES[i];} return null; }
function getEdge(id){ for(var i=0;i<EDGES.length;i++){if(EDGES[i].id===id)return EDGES[i];} return null; }
function edgeColor(e){
  if(e.action==='deny') return '#dc2626';
  return ZONES[getNode(e.to).zone].stroke;
}

/* ================= 构建 SVG ================= */
var topo=document.getElementById('topo');
var edgeLayer=svgEl('g',{},topo);
var nodeLayer=svgEl('g',{},topo);
var packetEl;

function buildDefs(){
  var defs=svgEl('defs',{},topo);
  var colors={};
  EDGES.forEach(function(e){ colors[edgeColor(e)]=1; });
  Object.keys(colors).forEach(function(c){
    var id='ar-'+c.replace('#','');
    var m=svgEl('marker',{id:id,markerWidth:9,markerHeight:9,refX:7.4,refY:4.5,orient:'auto',markerUnits:'userSpaceOnUse'},defs);
    svgEl('path',{d:'M0,0 L9,4.5 L0,9 z',fill:c},m);
  });
}
function buildEdges(){
  EDGES.forEach(function(e){
    var c=edgeColor(e);
    /* 透明加宽命中区，保证细线/变暗状态下也容易点击与悬停 */
    svgEl('path',{class:'edge edge-hit','data-id':e.id,d:e.d,fill:'none'},edgeLayer);
    var p=svgEl('path',{class:'edge edge-visible','data-id':e.id,d:e.d,stroke:c,'marker-end':'url(#ar-'+c.replace('#','')+')'},edgeLayer);
    e._el=p;
    var mid=0.5, pt=p.getPointAtLength(p.getTotalLength()*mid);
    var tx=svgEl('text',{x:pt.x,y:pt.y-5,fill:c,'font-size':11,'font-weight':700,'text-anchor':'middle',
      style:'paint-order:stroke;stroke:#ffffff;stroke-width:3.5;pointer-events:none'},edgeLayer);
    tx.textContent=e.label; e._label=tx;
  });
}
function buildNodes(){
  NODES.forEach(function(n){
    if(n.box){
      var g=svgEl('g',{'data-id':n.id},nodeLayer);
      svgEl('rect',{class:'zone-rect',x:n.x,y:n.y,width:n.w,height:n.h,fill:'rgba(14,143,168,.07)',stroke:ZONES[n.zone].stroke},g);
      var t=svgEl('text',{class:'zone-title',x:n.x+16,y:n.y+24,fill:ZONES[n.zone].stroke},g); t.textContent=n.name;
      var s=svgEl('text',{x:n.x+118,y:n.y+24,fill:'#64748b','font-size':11},g); s.textContent=n.sub;
      n._el=g; return;
    }
    var z=ZONES[n.zone];
    var g=svgEl('g',{class:'node','data-id':n.id},nodeLayer);
    svgEl('rect',{class:'card',x:n.x,y:n.y,width:n.w,height:n.h,fill:z.fill,stroke:z.stroke},g);
    var ig=svgEl('g',{transform:'translate('+(n.x+14)+','+(n.y+17)+')'},g);
    ig.insertAdjacentHTML('beforeend','<g class="nicon" stroke="'+z.stroke+'">'+ICONS[n.icon]+'</g>');
    var t1=svgEl('text',{class:'nlabel',x:n.x+46,y:n.y+28},g); t1.textContent=n.name;
    var t2=svgEl('text',{class:'nsub',x:n.x+46,y:n.y+47},g); t2.textContent=n.sub;
    n._el=g;
  });
  packetEl=svgEl('circle',{class:'packet',r:7,cx:-20,cy:-20,opacity:0},nodeLayer);
}

/* ================= 状态应用（点亮 / 变暗 / 流动） ================= */
function applyState(){
  var path=currentPath(), total=path.length;
  var activeSet={};
  path.slice(0,state.step).forEach(function(id){activeSet[id]=true;});
  var nodeSet={};
  if(state.step===0){ nodeSet[state.access.id==='wan'?'vdi':'invdi']=true; }
  path.slice(0,state.step).forEach(function(id){var e=getEdge(id);nodeSet[e.from]=true;nodeSet[e.to]=true;});

  EDGES.forEach(function(e){
    var el=e._el; el.classList.remove('dim','flow','selected');
    var isSel=state.selected===e.id && state.selectedKind==='edge';
    var lit=activeSet[e.id] || e.id===state.traveling || isSel;
    if(isSel) el.classList.add('selected');
    if(activeSet[e.id] || e.id===state.traveling){
      if(e.id===path[state.step-1] || e.id===state.traveling) el.classList.add('flow');
    } else if(!isSel){ el.classList.add('dim'); }
    if(e._label) e._label.style.opacity=lit?'1':'.2';
  });
  NODES.forEach(function(n){
    if(n.box) return;
    n._el.classList.toggle('dim', !nodeSet[n.id]);
  });
  var dmzOn=nodeSet['sslvpn']||nodeSet['broker']||nodeSet['waf'];
  getNode('dmzbox')._el.classList.toggle('dim',!dmzOn);

  document.getElementById('bar').style.width=(state.step/total*100)+'%';
  document.getElementById('stepno').textContent=state.step+' / '+total;
  document.getElementById('prev').disabled=state.step===0;
  document.getElementById('next').disabled=state.step===total;
  syncControlActive();
  renderJourney();
}

/* ================= 数据包 ================= */
function movePacket(pt){ packetEl.setAttribute('cx',pt.x); packetEl.setAttribute('cy',pt.y); packetEl.setAttribute('opacity',1); }
function placePacketAtEnd(id){ var p=getEdge(id)._el; movePacket(p.getPointAtLength(p.getTotalLength())); }
function hidePacket(){ packetEl.setAttribute('opacity',0); }

/* ================= 分步播放（rAF 驱动） ================= */
var raf=null, edgeStart=0, waiting=0;
var EDGE_DUR=1100, PAUSE=320;
function setPlayUI(){
  var icon=document.getElementById('playIcon');
  if(state.playing){ icon.innerHTML='<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>'; document.getElementById('playTxt').textContent='暂停'; }
  else { icon.innerHTML='<path d="M8 5v14l11-7z"/>'; document.getElementById('playTxt').textContent='播放'; }
}
function startPlay(){
  if(state.step>=currentPath().length){ state.step=0; }
  state.playing=true; edgeStart=0; waiting=0; state.traveling=null;
  setPlayUI(); raf=requestAnimationFrame(tick);
}
function stopPlay(){
  state.playing=false; state.traveling=null; setPlayUI(); applyState();
  if(state.step>0) placePacketAtEnd(currentPath()[state.step-1]); else hidePacket();
}
function tick(ts){
  if(!state.playing) return;
  var path=currentPath();
  if(state.step>=path.length){ stopPlay(); return; }
  var curId=path[state.step];
  if(state.traveling!==curId){ state.traveling=curId; applyState(); edgeStart=ts; }
  if(waiting){ if(ts<waiting){ raf=requestAnimationFrame(tick); return; } waiting=0; edgeStart=ts; }
  var p=getEdge(curId)._el, len=p.getTotalLength();
  var raw=(ts-edgeStart)/EDGE_DUR;
  if(raw>=1){
    state.traveling=null; state.step++; waiting=ts+PAUSE; applyState(); placePacketAtEnd(curId);
    raf=requestAnimationFrame(tick); return;
  }
  movePacket(p.getPointAtLength(raw*len));
  raf=requestAnimationFrame(tick);
}

/* ================= 按钮事件 ================= */
function setAccess(a){ stopPlay(); state.access=a; state.step=0; state.selected=null; state.selectedKind=null; applyState(); hidePacket(); renderDetail(); }
function setTarget(t){ stopPlay(); state.target=t; state.step=0; state.selected=null; state.selectedKind=null; applyState(); hidePacket(); renderDetail(); }
document.getElementById('play').addEventListener('click',function(){ state.playing?stopPlay():startPlay(); });
document.getElementById('next').addEventListener('click',function(){
  stopPlay();
  if(state.step<currentPath().length){ state.step++; applyState(); placePacketAtEnd(currentPath()[state.step-1]); }
});
document.getElementById('prev').addEventListener('click',function(){
  stopPlay();
  if(state.step>0){ state.step--; applyState(); if(state.step>0) placePacketAtEnd(currentPath()[state.step-1]); else hidePacket(); }
});
document.getElementById('reset').addEventListener('click',function(){
  stopPlay(); state.step=0; state.selected=null; state.selectedKind=null; applyState(); hidePacket(); renderDetail();
});

    var cls=e.action==='deny'?'d':'a';
    html='<div class="tt">'+e.title+'</div><div class="tm">'+e.src+' → '+e.dst+'</div>'+
      '<div class="ta '+cls+'">'+actionName(e.action)+' · '+e.proto+'</div>';
  } else {
    var n=getNode(id);
    html='<div class="tt">'+n.name+'</div><div class="tm">'+n.sub+'</div><div class="ta a">'+ZONES[n.zone].name+'</div>';
  }
  tip.innerHTML=html; tip.classList.add('show'); positionTip(x,y);
}
function positionTip(x,y){
  var w=tip.offsetWidth, h=tip.offsetHeight;
  var left=x+15, top=y+15;
  if(left+w>window.innerWidth-8) left=x-w-15;
  if(top+h>window.innerHeight-8) top=y-h-15;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hideTip(){ tip.classList.remove('show'); }

/* ================= SVG 事件委托 ================= */
topo.addEventListener('click',function(ev){
  var edge=ev.target.closest('.edge');
  if(edge){ selectEdge(edge.dataset.id); return; }
  var node=ev.target.closest('.node, g[data-id]');
  if(node && node.dataset.id) selectNode(node.dataset.id);
});
topo.addEventListener('mouseover',function(ev){
  var edge=ev.target.closest('.edge');
  if(edge){ showTip('edge',edge.dataset.id,ev.clientX,ev.clientY); return; }
  var node=ev.target.closest('.node, g[data-id]');
  if(node && node.dataset.id) showTip('node',node.dataset.id,ev.clientX,ev.clientY);
});
topo.addEventListener('mousemove',function(ev){
  if(!tip.classList.contains('show')) return;
  if(ev.target.closest('.edge')||ev.target.closest('.node, g[data-id]')) positionTip(ev.clientX,ev.clientY);
});
topo.addEventListener('mouseout',function(ev){
  if(!ev.relatedTarget || !topo.contains(ev.relatedTarget)) hideTip();
});

/* ================= 初始化 ================= */
buildDefs();
buildEdges();
buildNodes();
renderAccess();
renderTargets();
renderLegend();
applyState();
renderDetail();
</script>
</body>
</html>
